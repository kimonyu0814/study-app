name: APK 만들기

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "RELEASE_NOTES.md"
      - "pc/**"
      - ".github/workflows/pc.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 인터넷이 안 될 때 쓸 페이지 사본 넣기
        run: |
          mkdir -p app/src/main/assets
          cp docs/index.html docs/check.html docs/family.html app/src/main/assets/

      - name: APK 빌드
        run: gradle assembleRelease -PvCode=${{ github.run_number }} --no-daemon

      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/release/app-release.apk study-app.apk

      - name: 릴리스로 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 학습기록 앱 v${{ github.run_number }}
          body_path: RELEASE_NOTES.md
          files: study-app.apk
          make_latest: "true"
