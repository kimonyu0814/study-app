<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>학습기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
/* 깔끔한 플래너: 흰 종이, 남색 잉크, 과목마다 색 띠 하나 */
:root{
  --paper:#FBFAF7; --card:#FFFFFF; --rule:#E4E1D8; --rule-soft:#EFEDE6;
  --ink:#1F2433; --muted:#6E7180; --accent:#2F4A8A; --ok:#2E7D4F; --warn:#B7791F; --bad:#C2372D;
  --home:#1F2433; --grade:#2F4A8A; --y1:#3D4A5C; --y2:#3D4A5C; --y3:#3D4A5C;
  --etc:#5F6675; --kor:#B4483A; --math:#3B7D5A; --eng:#2F6E9E; --hist:#9C3D6A; --soc:#8A5A2B; --sci:#6B4FA0;
  --c:var(--home);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15171D; --card:#1C1F27; --rule:#2E323D; --rule-soft:#252832;
    --ink:#E9E8EE; --muted:#A2A5B3; --accent:#8FA8E8; --ok:#5CC48A; --warn:#E3B04B; --bad:#FF7B70;
    --home:#C9CCD8; --grade:#8FA8E8; --y1:#B4BCCB; --y2:#B4BCCB; --y3:#B4BCCB;
    --etc:#9AA0AE; --kor:#E07F70; --math:#6FBF93; --eng:#6FAAD6; --hist:#DB7FA9; --soc:#C99A63; --sci:#A98EE0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15171D; --card:#1C1F27; --rule:#2E323D; --rule-soft:#252832;
  --ink:#E9E8EE; --muted:#A2A5B3; --accent:#8FA8E8; --ok:#5CC48A; --warn:#E3B04B; --bad:#FF7B70;
  --home:#C9CCD8; --grade:#8FA8E8; --y1:#B4BCCB; --y2:#B4BCCB; --y3:#B4BCCB;
  --etc:#9AA0AE; --kor:#E07F70; --math:#6FBF93; --eng:#6FAAD6; --hist:#DB7FA9; --soc:#C99A63; --sci:#A98EE0;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.55}
main{max-width:820px;margin:0 auto;padding:28px 16px 80px}
button,input,select,textarea{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-family:"Nanum Myeongjo","Batang",serif;font-weight:800;font-size:2rem;margin:0;letter-spacing:-.02em;text-wrap:balance}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);margin-top:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.on::before{background:var(--ok)} .sync.busy::before{background:var(--warn)} .sync.err::before{background:var(--bad)}
.btn{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:6px;padding:8px 14px;font-weight:700;font-size:.92rem;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.good{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{border-color:var(--rule);color:var(--muted);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions[hidden]{display:none}

.editbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  margin-top:16px;padding:10px 14px;border:1.5px dashed var(--warn);border-radius:8px;color:var(--warn);font-size:.9rem;font-weight:700}
.editbar[hidden]{display:none}
.notice{margin-top:14px;padding:10px 14px;border-radius:8px;font-size:.88rem;background:var(--rule-soft);color:var(--ink)}
.notice.bad{color:var(--bad)}
.notice[hidden]{display:none}
.notice .actions{margin-top:8px}

/* 탭: 1단(메뉴) · 2단(학기) · 3단(과목) */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:22px}
.tab{position:relative;border:1.5px solid var(--rule);background:var(--card);color:var(--ink);border-radius:8px;padding:10px 2px 8px;cursor:pointer;text-align:center;font-weight:700;font-size:1rem;min-width:0}
.tab small{display:block;font-weight:500;font-size:.7rem;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{border-color:var(--c);background:var(--c);color:var(--paper)}
.tab[aria-selected="true"] small{color:inherit;opacity:.85}
.semrow{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:none;background:transparent;color:var(--muted);padding:8px 18px;cursor:pointer;font-weight:700;font-size:.92rem;position:relative}
.seg button + button{border-left:1.5px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.now{display:inline-block;font-size:.66rem;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:2px}
.seg button[aria-pressed="true"] .now{color:var(--paper);border-color:var(--paper)}
.semhint{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.semhint b{color:var(--ink)}
.exdate{display:inline-flex;align-items:center;gap:6px;color:var(--warn);font-weight:700}
.exdate input{padding:5px 8px;border:1.5px solid var(--warn);border-radius:6px;background:var(--paper);color:var(--ink)}
.stabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(96px,30%),1fr));gap:6px;margin-top:10px}
.stab .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.stempty{grid-column:1/-1;padding:10px 0}
.stab{position:relative;border:1.5px solid var(--rule);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 2px 6px;cursor:pointer;text-align:center;font-weight:700;font-size:.95rem;min-width:0}
.stab small{display:block;font-weight:500;font-size:.68rem;color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stab::before{content:"";position:absolute;left:8px;right:8px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--c)}
.stab[aria-selected="true"]{border-color:var(--c);background:var(--c);color:#fff}
.stab[aria-selected="true"] small{color:#fff;opacity:.9}
@media (max-width:520px){.tab{font-size:.92rem}}

.panel{margin-top:18px;border-top:4px solid var(--c)}
.sec{background:var(--card);border:1px solid var(--rule);border-top:none;padding:16px 16px 14px;min-width:0}
.sec + .sec{border-top:1px solid var(--rule)}
.sec h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 10px;font-size:1.02rem;flex-wrap:wrap}
.sec h2 .meta{font-size:.8rem;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:.88rem;margin:2px 0}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule-soft)}
ul.list li:last-child{border-bottom:none}
.txt{flex:1;min-width:0;word-break:keep-all;overflow-wrap:anywhere}
.done .txt{text-decoration:line-through;color:var(--muted)}
.mark{flex:none;width:20px;height:20px;border:1.8px solid var(--muted);border-radius:4px;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#fff}
.done .mark{background:var(--ok);border-color:var(--ok)}
.bullet{flex:none;width:6px;height:6px;border-radius:50%;background:var(--c);margin-top:10px}
.dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:8px}
.tag{flex:none;font-size:.72rem;color:var(--muted);border:1px solid var(--rule);border-radius:4px;padding:0 6px;margin-top:2px;white-space:nowrap}
.pill{flex:none;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;border:1.5px solid var(--rule);color:var(--muted);margin-top:1px}
.pill.s1{border-color:var(--warn);color:var(--warn)}
.pill.s2{border-color:var(--ok);background:var(--ok);color:#fff}
.due{flex:none;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px;white-space:nowrap}
.due.soon{color:var(--warn);font-weight:700}
.due.over{color:var(--bad);font-weight:700}
.bar{display:flex;height:6px;border-radius:3px;background:var(--rule-soft);overflow:hidden;margin:0 0 10px}
.bar i{background:var(--ok)} .bar b{background:var(--warn)}
.examline{font-size:.85rem;color:var(--muted);margin:-4px 0 10px}
.examline b{color:var(--c)}

/* 홈 */
.termline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);background:var(--card);border:1px solid var(--rule);border-top:none;padding:10px 18px 0}
.termline b{color:var(--ink)}
.termline select{padding:5px 8px;border:1.5px solid var(--warn);border-radius:6px;background:var(--paper);color:var(--ink)}
.hero{background:var(--card);border:1px solid var(--rule);border-top:none;padding:14px 18px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero .big{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:3.4rem;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero .what{font-size:.95rem;color:var(--muted);margin-top:8px}
.hero .what b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:420px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:4px 10px;border-radius:999px;border:1.5px solid var(--c);color:var(--ink);background:transparent;cursor:pointer;font-variant-numeric:tabular-nums}
.chip b{color:var(--c)}
.chip.past{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;border-left:1px solid var(--rule)}
.grid2 .sec{border-left:none}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.daynav{display:inline-flex;align-items:center;gap:4px}
.daynav button{border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:5px;width:28px;height:26px;cursor:pointer}
.daynav button:disabled{opacity:.35;cursor:default}
.daynav span{font-size:.85rem;font-weight:700;min-width:96px;text-align:center;font-variant-numeric:tabular-nums}
.prow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:7px 0;border:none;background:none;width:100%;text-align:left;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--rule-soft)}
.prow:last-child{border-bottom:none}
.prow .nm{font-weight:700;color:var(--c)}
.prow .bar{margin:0}
.prow .n{font-size:.78rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.big-n{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:1.6rem}
.gsum{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.gsum .big-n{color:var(--grade)}
.gchips{display:flex;flex-wrap:wrap;gap:6px}
.gchip{font-size:.78rem;border:1px solid var(--rule);border-radius:6px;padding:3px 8px;color:var(--muted);font-variant-numeric:tabular-nums}
.gchip b{color:var(--c)}

/* 성적 */
.terms{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media (max-width:560px){.terms{grid-template-columns:repeat(3,1fr)}}
.term{border:1.5px solid var(--rule);background:var(--card);border-radius:8px;padding:8px 4px;text-align:center;cursor:pointer;color:var(--ink);min-width:0}
.term small{display:block;font-size:.72rem;color:var(--muted)}
.term b{display:block;font-family:"Nanum Myeongjo",serif;font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.2}
.term[aria-pressed="true"]{border-color:var(--grade);box-shadow:inset 0 0 0 1.5px var(--grade)}
.term.cur small::after{content:" · 현재";color:var(--accent);font-weight:700}
.overall{display:flex;flex-wrap:wrap;gap:18px;align-items:baseline;margin-bottom:14px}
.overall .lab{font-size:.82rem;color:var(--muted)}
.overall .val{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:2.4rem;color:var(--grade);line-height:1;font-variant-numeric:tabular-nums}
.overall .yr{font-size:.85rem;color:var(--muted)} .overall .yr b{color:var(--ink);font-variant-numeric:tabular-nums}
.gtwrap{overflow-x:auto}
table.gt{width:100%;border-collapse:collapse;font-size:.9rem;min-width:520px}
.gt th{font-size:.76rem;color:var(--muted);font-weight:500;text-align:center;padding:6px 4px;border-bottom:1.5px solid var(--rule)}
.gt th:first-child,.gt td:first-child{text-align:left}
.gt td{padding:8px 4px;border-bottom:1px solid var(--rule-soft);text-align:center;font-variant-numeric:tabular-nums}
.gt td.sn{font-weight:700;color:var(--c);white-space:nowrap}
.gt td .gr{font-weight:800;color:var(--c)}
.gt td.na{color:var(--muted)}
.gt input,.gt select{width:100%;min-width:52px;max-width:76px;padding:6px 4px;border:1.5px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);text-align:center}
.gt tfoot td{border-bottom:none;font-weight:700;padding-top:10px}
.gnote{font-size:.78rem;color:var(--muted);margin:10px 0 0}

/* 차트 */
.chartsec h2{margin-bottom:6px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.ctrl .seg button{padding:5px 12px;font-size:.82rem}
.ctrl select{padding:5px 8px;border:1.5px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);font-size:.85rem}
.ctrl .vs{font-size:.8rem;color:var(--muted)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--rule-soft);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.chart .vlabel{fill:var(--ink);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.chart .line{fill:none;stroke:var(--c);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--c);opacity:.1}
.chart .pt{fill:var(--c);stroke:var(--card);stroke-width:2;pointer-events:none}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:focus{outline:none}
.chart .hit:focus-visible + .pt, .chart .pt.on{r:6}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:.78rem;line-height:1.35;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));z-index:3}
.tip[hidden]{display:none}
.cempty{font-size:.85rem;color:var(--muted);padding:18px 0;text-align:center;border:1px dashed var(--rule);border-radius:6px}
.multi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
@media (max-width:560px){.multi{grid-template-columns:1fr}}
.mini h3{display:flex;align-items:center;gap:6px;margin:0 0 2px;font-size:.88rem}
.mini h3 i{width:10px;height:3px;border-radius:2px;background:var(--c)}
.mini h3 span{margin-left:auto;font-size:.75rem;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.cmp{display:grid;grid-template-columns:44px 1fr 92px;gap:6px 10px;align-items:center}
.cmp .nm{font-size:.88rem;font-weight:700}
.cmp .track{position:relative;height:26px}
.cmp .track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--rule)}
.cmp .seglin{position:absolute;top:calc(50% - 1px);height:2px;background:var(--c);opacity:.55}
.cmp .d{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--card)}
.cmp .d.a{background:var(--card);border:2px solid var(--c)}
.cmp .d.b{background:var(--c)}
.cmp .chg{font-size:.8rem;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
.cmp .chg.up{color:var(--ok);font-weight:700} .cmp .chg.dn{color:var(--bad);font-weight:700}
.cmp .scale{grid-column:2;display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted)}
.ckey{display:flex;gap:14px;font-size:.78rem;color:var(--muted);margin:8px 0 0;flex-wrap:wrap}
.ckey span{display:inline-flex;align-items:center;gap:6px}
.ckey .o{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted)}
.ckey .f{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.modebar{background:var(--card);border:1px solid var(--rule);border-top:none;padding:12px 16px}
.modebar .seg button{padding:7px 22px}
.mockyrs{display:grid;gap:8px}
.mockrow{display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:center}
.mockrow .yl{font-size:.85rem;font-weight:700;color:var(--muted)}
.terms.m4{grid-template-columns:repeat(4,1fr)}
.yrtrend .actions{gap:6px}
.yrtrend{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:12px 14px 8px;margin-top:10px}
.yrtrend .seg button{padding:5px 12px;font-size:.82rem}
.yrtrend h2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px;font-size:.92rem;flex-wrap:wrap}

/* 캘린더 */
.calhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.calhead .daynav span{min-width:110px}
.calhead .btn{padding:4px 10px;font-size:.8rem}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.cwd{font-size:.72rem;color:var(--muted);text-align:center;padding:4px 0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--rule-soft)}
.cwd.sun,.cday.sun .dn{color:var(--bad)}
.cday{position:relative;min-height:86px;padding:4px 4px 6px;border:none;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--card);color:var(--ink);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;font:inherit}
.cday .dn{font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.cday.out{background:var(--paper)} .cday.out .dn,.cday.out .ev{opacity:.45}
.cday.today .dn b{background:var(--ink);color:var(--paper);border-radius:999px;padding:0 6px}
.cday[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.cday .ex{font-size:.6rem;font-weight:700;color:#fff;background:var(--bad);border-radius:3px;padding:0 4px;line-height:1.5}
.cday .ev{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;font-size:.66rem;line-height:1.3;padding:1px 4px;border-radius:3px;border-left:3px solid var(--c);background:var(--rule-soft);overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.cday .ev.fin{opacity:.5;text-decoration:line-through}
.cday .more{font-size:.62rem;color:var(--muted)}
.cday .dots{display:none;gap:3px;flex-wrap:wrap}
.cday .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.cday .dots i.fin{opacity:.3}
@media (max-width:560px){.cday{min-height:54px;padding:3px} .cday .ev,.cday .more{display:none} .cday .dots{display:flex}}
.cdayp{margin-top:12px}
.cdayp h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 4px;font-size:.95rem;flex-wrap:wrap}
.cdayp h3 .meta{font-size:.8rem;font-weight:500;color:var(--muted)}
button.mark{background:transparent;padding:0;cursor:pointer}
.calnote{font-size:.85rem;margin:0 0 10px;padding:10px 12px;border:1.5px dashed var(--accent);border-radius:8px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.calnote .btn{padding:5px 12px;font-size:.85rem}
.erow select.sj{max-width:140px}

/* 과목 관리 */
.smgr{margin-top:10px;background:var(--card);border:1.5px dashed var(--warn);border-radius:8px;padding:12px 14px}
.smgr-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;font-size:.92rem}
.smgr .btn.sm{padding:5px 10px;font-size:.82rem}
.smgr .mv{border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:5px;width:30px;height:32px;cursor:pointer;flex:none}
.smgr .mv:disabled{opacity:.3;cursor:default}
.smgr .del.arm{color:#fff;background:var(--bad);border-radius:5px;font-size:.8rem}

/* 수정 모드 */
/* 바로 고치기 (관리 안 눌러도) */
.qe .txt{cursor:text;border-radius:4px}
.qe .txt:hover{background:var(--rule-soft)}
.qe .txt input{width:100%;padding:4px 6px;border:1.5px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit}
.qe button.pill{cursor:pointer;background:none}
.qe button.pill.s2{background:var(--ok)}
.qe .due.qd{cursor:pointer;text-decoration:underline dotted}
.qe .due.qd.none{opacity:.55}
.qe input.qdate{flex:none;padding:2px 4px;border:1.5px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);font-size:.8rem}
.qe .qx{flex:none;border:none;background:none;color:var(--muted);cursor:pointer;padding:0 4px;font-size:.9rem}
.qe .qx.arm{color:var(--bad);font-weight:700}
.erow{display:flex;gap:8px;align-items:center;padding:6px 0;flex-wrap:wrap}
.erow input[type="text"]{flex:1 1 200px;min-width:0;padding:8px 10px;border:1.5px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink)}
.erow input[type="date"],.erow select{padding:7px 8px;border:1.5px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink)}
.erow input[type="checkbox"]{width:20px;height:20px;accent-color:var(--ok);flex:none}
.erow .del{border:none;background:transparent;color:var(--bad);font-size:1.1rem;cursor:pointer;padding:4px 8px;flex:none}
.erow label{font-size:.85rem;color:var(--muted)}
.add{margin-top:8px;border:1.5px dashed var(--rule);background:transparent;color:var(--muted);border-radius:6px;padding:8px 12px;cursor:pointer;width:100%;text-align:left;font-size:.9rem}
.add:hover{border-color:var(--c);color:var(--c)}

/* 비밀번호 창 */
.modal{position:fixed;inset:0;background:rgba(10,12,20,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal[hidden]{display:none}
.dialog{background:var(--card);color:var(--ink);border-radius:10px;padding:20px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dialog h3{margin:0 0 6px;font-size:1.1rem}
.dialog p{margin:0 0 12px;font-size:.85rem;color:var(--muted)}
.dialog .pw{width:100%;padding:10px 12px;border:1.5px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);font-size:1.05rem;letter-spacing:.15em}
.dialog .msg{min-height:1.4em;font-size:.82rem;color:var(--bad);margin:6px 0 10px}
.dialog .actions{justify-content:flex-end}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>학습기록</h1>
      <span class="sync" id="sync">불러오는 중…</span>
    </div>
    <div class="actions" id="viewActions">
      <button type="button" class="btn" id="editBtn">관리</button>
    </div>
  </div>

  <div class="editbar" id="editbar" hidden>
    <span>수정 중 · 여러 탭을 고친 뒤 한 번에 저장할 수 있습니다</span>
    <span class="actions">
      <button type="button" class="btn ghost" id="cancelBtn">취소</button>
      <button type="button" class="btn good" id="saveBtn">수정 완료</button>
    </span>
  </div>
  <div class="notice" id="notice" hidden></div>

  <nav aria-label="메뉴">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="sub"></div>
  </nav>
  <div class="panel" id="panel" role="tabpanel"></div>
</main>

<div class="modal" id="pwModal" hidden>
  <form class="dialog" id="pwForm" autocomplete="off">
    <h3>비밀번호 확인</h3>
    <p>비밀번호를 입력하세요. 이 기기에서는 다음부터 묻지 않습니다.</p>
    <input type="password" class="pw" id="pwInput" inputmode="numeric" aria-label="비밀번호">
    <div class="msg" id="pwMsg" aria-live="polite"></div>
    <div class="actions">
      <button type="button" class="btn ghost" id="pwCancel">취소</button>
      <button type="submit" class="btn primary" id="pwOk">확인</button>
    </div>
  </form>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzwUGDOfoBCJbPQx96HCMN8vin0OPCcREB-kYGv-yiDVGkHIOlapcL85oasQRA71NdX/exec";
const SUBJECTS = [
  { k: "kor", n: "국어" }, { k: "math", n: "수학" }, { k: "eng", n: "영어" },
  { k: "hist", n: "역사" }, { k: "soc", n: "사회" }, { k: "sci", n: "과학" }
];
SUBJECTS.forEach(s => s.g = s.k);
const SNAME = Object.fromEntries(SUBJECTS.map(s => [s.k, s.n]));
const GROUPS = [...SUBJECTS.map(s => ({ k: s.k, n: s.n + " 계열" })), { k: "etc", n: "기타" }];
const GROUP_K = GROUPS.map(x => x.k);
const BASE_LIST = () => SUBJECTS.map(s => ({ k: s.k, n: s.n, g: s.k }));
const SECTIONS = [
  { k: "range", n: "시험범위",     add: "시험범위 추가",  ph: "예: 교과서 1~3단원 (p.12~86)" },
  { k: "prog",  n: "진도 현황",    add: "진도 항목 추가", ph: "예: 2단원 개념 정리" },
  { k: "hw",    n: "관련 학원 숙제", add: "학원 숙제 추가", ph: "예: 쎈 B단계 120~140번" },
  { k: "todo",  n: "할 것",        add: "할 것 추가",    ph: "예: 오답노트 정리" }
];
const SECNAME = Object.fromEntries(SECTIONS.map(s => [s.k, s.n]));
const PROG = ["안 함", "진행 중", "완료"];
const EXAMS = [{ k: "mid", n: "중간고사" }, { k: "fin", n: "기말고사" }];
const EXN = { mid: "중간고사", fin: "기말고사" };
const WD = ["월", "화", "수", "목", "금", "토", "일"];
const TERMS = ["1-1", "1-2", "2-1", "2-2", "3-1", "3-2"];
const termName = t => `${t[0]}학년 ${t[2]}학기`;
const MAIN = [{ k: "home", n: "홈" }, { k: "grade", n: "성적" }, { k: "y1", n: "1학년" }, { k: "y2", n: "2학년" }, { k: "y3", n: "3학년" }];
MAIN.forEach(m => m.g = m.k);
const GFIELDS = [
  { k: "mid", n: "중간", type: "num" }, { k: "fin", n: "기말", type: "num" }, { k: "perf", n: "수행", type: "num" },
  { k: "ach", n: "성취도", type: "sel", opts: ["", "A", "B", "C", "D", "E"] },
  { k: "grade", n: "등급", type: "sel", opts: ["", "1", "2", "3", "4", "5"] },
  { k: "credit", n: "학점", type: "num" }
];
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const pad2 = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const today = () => ymd(new Date());
const parseD = s => { const d = new Date(s + "T00:00:00"); return isNaN(d) ? null : d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const wdIdx = d => (d.getDay() + 6) % 7;
const md = d => `${d.getMonth() + 1}/${d.getDate()}(${WD[wdIdx(d)]})`;

/* 화면 상태 */
let data = emptyData(), rev = 0;
let nav = { main: "home", sem: { y1: 2, y2: 1, y3: 1 }, subj: "kor", gterm: null };
let editing = false, draft = null, pw = "", homeDay = today(), calSel = today(), busySave = false, pwNext = null;
let savedPw = ""; try { savedPw = localStorage.getItem("examPw") || ""; } catch(e){}
/* 앱에서 0000 으로 들어왔으면 앱의 비밀번호 사용 */
try { if (window.App && App.role() === "0000" && App.pw()) savedPw = App.pw(); } catch(e){}
/* 엄마 · 아빠 앱에서는 보기만 (관리 · 체크 · 계획 넣기 없음) */
const VIEW_ONLY = (() => { try { return !!(window.App && App.role() !== "0000"); } catch(e){ return false; } })();
if (VIEW_ONLY) $("viewActions").hidden = true;
try { const n = JSON.parse(localStorage.getItem("studyNav")); if (n && MAIN.some(x => x.k === n.main)) nav = Object.assign(nav, n); } catch(e){}
nav.main = "home";   // 켤 때는 언제나 홈부터
try { const c = JSON.parse(localStorage.getItem("examCache")); if (c && c.data){ data = normalize(c.data); rev = c.rev || 0; } } catch(e){}
const saveNav = () => { try { localStorage.setItem("studyNav", JSON.stringify(nav)); } catch(e){} };

function emptySubj(){ return { examDate: "", range: [], prog: [], hw: [], todo: [] }; }
/* 1학년은 기본 6과목, 2·3학년은 직접 추가 */
function emptyTerm(t){ const list = t && t[0] === "1" ? BASE_LIST() : []; const s = {}, g = {}; list.forEach(x => { s[x.k] = emptyPair(); g[x.k] = {}; }); return { subjList: list, subjects: s, grades: g, examDates: { mid: "", fin: "" } }; }
function emptyData(){ const t = {}; TERMS.forEach(k => t[k] = emptyTerm(k)); const m = {}; MOCKS_K().forEach(k => m[k] = {}); return { curTerm: "1-2", curExam: "fin", terms: t, mock: m, schedule: [], cal: [], seeds: {} }; }
function MOCKS_K(){ return [1, 2, 3].flatMap(y => [3, 6, 9, 11].map(m => `${y}-${m}`)); }
function emptyPair(){ return { mid: emptySubj(), fin: emptySubj() }; }
/* 예전 기록(중간·기말 구분 없음)은 기말고사로 옮김 */
function normPair(s){ return s && (s.mid || s.fin) ? { mid: normSubj(s.mid), fin: normSubj(s.fin) } : { mid: emptySubj(), fin: normSubj(s) }; }
function normSubj(s){ const o = emptySubj(); s = s || {}; o.examDate = s.examDate || ""; SECTIONS.forEach(x => { o[x.k] = Array.isArray(s[x.k]) ? s[x.k] : []; }); return o; }
function hasContent(src, k){
  const s = src.subjects && src.subjects[k], g = src.grades && src.grades[k];
  const has = o => !!(o && (o.examDate || SECTIONS.some(x => (o[x.k] || []).length)));
  return !!((s && (has(s) || has(s.mid) || has(s.fin))) || (g && Object.keys(g).length));
}
function normalize(d){
  const out = emptyData(); d = d || {};
  if (TERMS.includes(d.curTerm)) out.curTerm = d.curTerm;
  out.curExam = d.curExam === "mid" ? "mid" : "fin";
  /* 예전 형식(학기 구분 없음)은 1학년 2학기로 옮김 */
  if (d.subjects && !d.terms){ SUBJECTS.forEach(x => { out.terms["1-2"].subjects[x.k] = normPair(d.subjects[x.k]); }); out.terms["1-2"].examDates.fin = SUBJECTS.map(x => (d.subjects[x.k] || {}).examDate).filter(Boolean).sort()[0] || ""; }
  if (d.terms) TERMS.forEach(t => {
    const src = d.terms[t] || {}, T = out.terms[t];
    let list = Array.isArray(src.subjList)
      ? src.subjList.filter(x => x && x.k && x.n).map(x => ({ k: String(x.k), n: String(x.n), g: GROUP_K.includes(x.g) ? x.g : "etc" }))
      : (t[0] === "1" ? BASE_LIST() : BASE_LIST().filter(x => hasContent(src, x.k)));
    T.subjList = list; T.subjects = {}; T.grades = {};
    /* 시험일은 시험 하나에 하나 (예전 과목별 시험일은 가장 이른 날로 합침) */
    const ed = src.examDates || {};
    EXAMS.forEach(e => {
      if (ed[e.k]) { T.examDates[e.k] = ed[e.k]; return; }
      const ds = [];
      Object.values(src.subjects || {}).forEach(sj => { if (!sj) return; const o = (sj.mid || sj.fin) ? sj[e.k] : (e.k === "fin" ? sj : null); if (o && o.examDate) ds.push(o.examDate); });
      T.examDates[e.k] = ds.sort()[0] || "";
    });
    list.forEach(x => {
      T.subjects[x.k] = normPair(src.subjects && src.subjects[x.k]);
      T.grades[x.k] = Object.assign({}, (src.grades && src.grades[x.k]) || {});
    });
  });
  if (d.mock) MOCKS_K().forEach(e => { const src = d.mock[e] || {}; SUBJECTS.forEach(x => { if (src[x.k]) out.mock[e][x.k] = Object.assign({}, src[x.k]); }); });
  out.schedule = Array.isArray(d.schedule) ? d.schedule : [];   /* 시간표(보류)는 그대로 보관 */
  out.cal = Array.isArray(d.cal) ? d.cal.filter(x => x && typeof x === "object") : [];   /* 과목 없는 공통 할 일 */
  out.seeds = d.seeds && typeof d.seeds === "object" ? Object.assign({}, d.seeds) : {};
  return out;
}
const view = () => editing ? draft : data;
const curTerm = () => view().curTerm;
const TS = t => view().terms[t].subjList;
const subjOf = (t, k, ex) => view().terms[t].subjects[k][ex];
const curExam = () => view().curExam || "fin";
/* 학년 탭에서 고른 시험 (없으면 현재 학기는 현재 시험, 나머지는 중간고사) */
const navEx = () => { const t = navTerm(), e = (nav.ex || {})[t]; return e === "mid" || e === "fin" ? e : (t === curTerm() ? curExam() : "mid"); };
const yearKey = m => m[1];                       /* "y2" → "2" */
const navTerm = () => `${yearKey(nav.main)}-${nav.sem[nav.main]}`;

/* ---------- 동기화 ---------- */
function setSync(s, text){
  const m = { load: ["busy", "불러오는 중…"], on: ["on", "모든 기기와 동기화됨"], busy: ["busy", "저장 중…"],
              err: ["err", "연결 안 됨 · 마지막으로 불러온 내용 표시 중"], old: ["err", "Apps Script 업데이트 필요"] }[s];
  $("sync").className = "sync " + m[0]; $("sync").textContent = text || m[1];
}
function notice(html, bad){ const n = $("notice"); n.hidden = !html; n.className = "notice" + (bad ? " bad" : ""); n.innerHTML = html || ""; return n; }
async function pull(){
  if (editing || busySave) return;
  { const ae = document.activeElement; if (ae && ae.closest && ae.closest(".qe") && /INPUT|SELECT|TEXTAREA/.test(ae.tagName)) return; }   // 바로 고치는 중
  try {
    const r = await fetch(API + "?app=exam&t=" + Date.now());
    const j = await r.json();
    if (!j || !j.exam){ setSync("old"); notice("Apps Script를 새 코드로 바꾸고 <b>새 버전으로 배포</b>해야 동기화됩니다.", true); return; }
    if (editing || busySave) return;
    data = normalize(j.data); rev = j.rev || 0;
    try { localStorage.setItem("examCache", JSON.stringify({ data, rev })); } catch(e){}
    setSync("on"); render();
    if (!VIEW_ONLY && !movedPlan && (data.seeds || {}).plan1 && !(data.seeds || {}).plan2){ movedPlan = true; commit(d => movePlan2(d)); }
  } catch(e){ setSync("err"); }
}
var movedPlan = false;
async function post(body){
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ app: "exam" }, body)) });
  return r.json();
}

/* ---------- 수정 모드 ---------- */
function askPw(next){ pwNext = next; $("pwMsg").textContent = ""; $("pwInput").value = ""; $("pwModal").hidden = false; setTimeout(() => $("pwInput").focus(), 30); }
function rememberPw(v){ savedPw = v; try { localStorage.setItem("examPw", v); } catch(e){} }
function forgetPw(){ savedPw = ""; try { localStorage.removeItem("examPw"); } catch(e){} }
/* 저장된 비밀번호가 있으면 바로, 없으면 물어본 뒤 실행 */
function withPw(fn){ if (savedPw) fn(savedPw); else askPw(fn); }
const goEdit = async v => { pw = v; await pull().catch(() => {}); startEdit(); };
$("editBtn").onclick = async () => {
  if (savedPw){
    try { const j = await post({ action: "auth", pw: savedPw }); if (j && j.ok && j.exam) return goEdit(savedPw); if (j && j.error === "pw") forgetPw(); } catch(e){}
  }
  askPw(goEdit);
};
$("pwCancel").onclick = () => { $("pwModal").hidden = true; };
$("pwModal").addEventListener("click", e => { if (e.target.id === "pwModal") $("pwModal").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("pwModal").hidden = true; });
$("pwForm").onsubmit = async e => {
  e.preventDefault();
  const v = $("pwInput").value; if (!v){ $("pwMsg").textContent = "비밀번호를 입력하세요."; return; }
  $("pwOk").disabled = true; $("pwMsg").textContent = "";
  try {
    const j = await post({ action: "auth", pw: v });
    if (j && j.ok && j.exam){ rememberPw(v); $("pwModal").hidden = true; const f = pwNext; pwNext = null; if (f) await f(v); }
    else if (j && j.error === "pw"){ $("pwMsg").textContent = "비밀번호가 맞지 않습니다."; $("pwInput").select(); }
    else $("pwMsg").textContent = "Apps Script를 새 버전으로 배포해야 합니다.";
  } catch(err){ $("pwMsg").textContent = "연결하지 못했습니다. 인터넷 연결을 확인하세요."; }
  $("pwOk").disabled = false;
};
function startEdit(){ editing = true; draft = clone(data); $("editbar").hidden = false; $("viewActions").hidden = true; notice(""); render(); }
function endEdit(){ editing = false; draft = null; pw = ""; $("editbar").hidden = true; $("viewActions").hidden = false; render(); }
$("cancelBtn").onclick = () => { endEdit(); pull(); };
$("saveBtn").onclick = () => save(false);
async function save(force){
  clean(draft);
  $("saveBtn").disabled = true; setSync("busy");
  try {
    const j = await post({ action: "save", pw, baseRev: rev, force, data: draft });
    if (j && j.ok){
      data = draft; rev = j.rev;
      try { localStorage.setItem("examCache", JSON.stringify({ data, rev })); } catch(e){}
      setSync("on", "저장 완료 · 모든 기기와 동기화됨");
      $("saveBtn").disabled = false; endEdit(); return;
    }
    if (j && j.error === "conflict"){
      setSync("on");
      const n = notice("다른 기기에서 먼저 저장한 내용이 있습니다. 내 수정 내용으로 <b>덮어쓸까요</b>, 아니면 수정을 취소하고 <b>최신 내용을 불러올까요</b>?", true);
      const a = el("div", "actions");
      const o = el("button", "btn good", "내 내용으로 덮어쓰기"); o.type = "button"; o.onclick = () => { notice(""); save(true); };
      const l = el("button", "btn ghost", "최신 내용 불러오기"); l.type = "button"; l.onclick = () => { notice(""); endEdit(); pull(); };
      a.append(o, l); n.appendChild(a);
    } else if (j && j.error === "pw"){ setSync("on"); forgetPw(); notice("비밀번호가 바뀌었습니다. 취소 후 다시 '관리'를 눌러 주세요.", true); }
    else throw new Error();
  } catch(e){ setSync("err", "저장 실패 · 인터넷 연결 확인 후 다시 '수정 완료'를 누르세요"); }
  $("saveBtn").disabled = false;
}
function clean(d){
  d.cal = (d.cal || []).filter(it => (it.t || "").trim());
  TERMS.forEach(t => {
    const T = d.terms[t];
    T.subjList = T.subjList.filter(x => (x.n || "").trim()); T.subjList.forEach(x => { x.n = x.n.trim(); });
    const ids = new Set(T.subjList.map(x => x.k));
    Object.keys(T.subjects).forEach(k => { if (!ids.has(k)) delete T.subjects[k]; });
    Object.keys(T.grades).forEach(k => { if (!ids.has(k)) delete T.grades[k]; });
    T.subjList.forEach(x => {
      EXAMS.forEach(e => SECTIONS.forEach(s => { T.subjects[x.k][e.k][s.k] = T.subjects[x.k][e.k][s.k].filter(it => (it.t || "").trim()); }));
      const g = T.grades[x.k]; Object.keys(g).forEach(f => { if (g[f] === "" || g[f] == null) delete g[f]; });
    });
  });
  Object.keys(d.mock || {}).forEach(e => SUBJECTS.forEach(x => {
    const g = d.mock[e][x.k]; if (!g) return;
    Object.keys(g).forEach(f => { if (g[f] === "" || g[f] == null) delete g[f]; });
    if (!Object.keys(g).length) delete d.mock[e][x.k];
  }));
}

/* ---------- 바로 저장 (체크 · 계획 넣기) ---------- */
/* mut 는 여러 번 실행해도 결과가 같아야 함 (다른 기기 저장과 겹치면 최신 내용에 다시 적용) */
function commit(mut){
  if (editing){ mut(draft); render(); return; }
  withPw(async p => {
    mut(data); render(); busySave = true; setSync("busy");
    try {
      for (let i = 0; i < 3; i++){
        clean(data);
        const j = await post({ action: "save", pw: p, baseRev: rev, data });
        if (j && j.ok){ rev = j.rev; try { localStorage.setItem("examCache", JSON.stringify({ data, rev })); } catch(e){} setSync("on", "저장 완료 · 모든 기기와 동기화됨"); return; }
        if (j && j.error === "conflict"){ data = normalize(j.data); rev = j.rev || 0; mut(data); render(); continue; }
        if (j && j.error === "pw"){ forgetPw(); busySave = false; setSync("on"); await pull(); notice("비밀번호가 바뀌었습니다. 다시 눌러 주세요.", true); return; }
        throw new Error();
      }
      throw new Error();
    } catch(e){ setSync("err", "저장 실패 · 인터넷 연결을 확인하세요"); }
    finally { busySave = false; }
  });
}
function findById(d, id){
  let hit = null;
  (d.cal || []).forEach(it => { if (it.id === id) hit = it; });
  TERMS.forEach(t => Object.values(d.terms[t].subjects).forEach(pr => EXAMS.forEach(e => { const o = pr[e.k]; if (o) ["hw", "todo"].forEach(k => o[k].forEach(it => { if (it.id === id) hit = it; })); })));
  return hit;
}

/* ---------- 캘린더 ---------- */
const KIND = { todo: "할 것", hw: "학원 숙제", cal: "공통" };
function calItems(t, only){
  const out = [];
  TS(t).forEach(x => {
    if (only && x.k !== only) return;
    EXAMS.forEach(e => {
      const s = subjOf(t, x.k, e.k);
      s.todo.forEach(it => { if (it.date) out.push({ it, arr: s.todo, d: it.date, n: x.n, g: x.g, kind: "todo" }); });
      s.hw.forEach(it => { if (it.due) out.push({ it, arr: s.hw, d: it.due, n: x.n, g: x.g, kind: "hw" }); });
    });
  });
  if (!only) (view().cal || []).forEach(it => { if (it.date) out.push({ it, arr: view().cal, d: it.date, n: "공통", g: "etc", kind: "cal" }); });
  return out;
}
function toggleItem(x){
  if (VIEW_ONLY) return;
  const want = !x.it.done;
  if (editing){ x.it.done = want; markDone(x.it, want); render(); return; }
  if (!x.it.id){ notice("이 항목은 '관리'에서 체크해 주세요."); return; }
  const id = x.it.id;
  commit(d => { const it = findById(d, id); if (it){ it.done = want; markDone(it, want); } });
}
function renderCal(t, only, ex){
  const sec = el("section", "sec calsec");
  const cur = parseD(calSel) || new Date();
  if (!/^\d{4}-\d{2}$/.test(nav.calM || "")) nav.calM = calSel.slice(0, 7);
  const [Y, M] = nav.calM.split("-").map(Number);
  const items = calItems(t, only);
  const by = {}; items.forEach(x => (by[x.d] = by[x.d] || []).push(x));
  Object.values(by).forEach(a => a.sort((p, q) => (p.it.done - q.it.done)));
  const exams = {}; EXAMS.forEach(e => { const d = examDate(t, e.k); if (d) exams[d] = e.n.slice(0, 2); });

  const h = el("h2", null, only ? "캘린더" : "캘린더 · 과목별 할 일");

  h.appendChild(el("span", "meta", left ? `밀린 일 ${left}개` : ""));
  sec.appendChild(h);

  if (!only && !editing && !VIEW_ONLY && !(data.seeds || {}).plan1){
    const nt = el("div", "calnote");
    nt.append(el("span", null, "10/22~12/8 통합사회·한국사 공부 계획(예비일 포함)을 캘린더에 넣을 수 있습니다."));
    const b = el("button", "btn primary", "공부 계획 넣기"); b.type = "button";
    b.onclick = () => commit(d => seedPlan(d));
    nt.appendChild(b); sec.appendChild(nt);
  }

  const head = el("div", "calhead"), dn = el("span", "daynav");
  const pv = el("button", null, "‹"); pv.type = "button"; pv.setAttribute("aria-label", "이전 달");
  const nx = el("button", null, "›"); nx.type = "button"; nx.setAttribute("aria-label", "다음 달");
  const go = k => { const d = new Date(Y, M - 1 + k, 1); nav.calM = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; saveNav(); render(); };
  pv.onclick = () => go(-1); nx.onclick = () => go(1);
  dn.append(pv, el("span", null, `${Y}년 ${M}월`), nx);
  const tb = el("button", "btn ghost", "오늘"); tb.type = "button";
  tb.onclick = () => { calSel = today(); nav.calM = calSel.slice(0, 7); saveNav(); render(); };
  head.append(dn, tb); sec.appendChild(head);

  const grid = el("div", "cgrid");
  WD.forEach((w, i) => grid.appendChild(el("div", "cwd" + (i === 6 ? " sun" : ""), w)));
  const first = new Date(Y, M - 1, 1), start = addDays(first, -wdIdx(first));
  const days = new Date(Y, M, 0).getDate(), weeks = Math.ceil((wdIdx(first) + days) / 7);
  const td = today();
  for (let i = 0; i < weeks * 7; i++){
    const d = addDays(start, i), k = ymd(d), list = by[k] || [];
    const c = el("button", "cday"); c.type = "button";
    if (d.getMonth() !== M - 1) c.classList.add("out");
    if (k === td) c.classList.add("today");
    if (wdIdx(d) === 6) c.classList.add("sun");
    c.setAttribute("aria-pressed", k === calSel);
    c.setAttribute("aria-label", `${md(d)}${exams[k] ? " " + exams[k] + "고사" : ""} 할 일 ${list.length}개`);
    const dl = el("span", "dn"); dl.appendChild(el("b", null, String(d.getDate())));
    if (exams[k]) dl.appendChild(el("span", "ex", exams[k]));
    c.appendChild(dl);
    const MAX = 2;
    list.slice(0, MAX).forEach(x => { const e = el("span", "ev" + (x.it.done ? " fin" : ""), x.it.t); e.title = `${x.n} · ${x.it.t}`; e.style.setProperty("--c", `var(--${x.g})`); c.appendChild(e); });
    if (list.length > MAX) c.appendChild(el("span", "more", `+${list.length - MAX}`));
    const dots = el("span", "dots");
    list.forEach(x => { const i2 = el("i", x.it.done ? "fin" : ""); i2.style.setProperty("--c", `var(--${x.g})`); dots.appendChild(i2); });
    c.appendChild(dots);
    c.onclick = () => { calSel = k; if (d.getMonth() !== M - 1) nav.calM = k.slice(0, 7); saveNav(); render(); };
    grid.appendChild(c);
  }
  sec.appendChild(grid);

  /* 고른 날 (오늘이면 마감 전인 학원 숙제도 함께) */
  const list = (by[calSel] || []).slice();
  if (calSel === td){
    const seen = new Set(list.map(x => x.it));
    TS(t).forEach(x => { if (only && x.k !== only) return; EXAMS.forEach(e => { const s = subjOf(t, x.k, e.k);
      s.hw.forEach(it => { if (!it.done && !seen.has(it) && (!it.due || it.due > td)) list.push({ it, arr: s.hw, d: it.due || "", n: x.n, g: x.g, kind: "hw", ahead: true }); });
    }); });
  }
  const box = el("div", "cdayp");
  const h3 = el("h3", null, md(cur) + (exams[calSel] ? ` · ${exams[calSel]}고사` : ""));
  h3.appendChild(el("span", "meta", list.length ? `할 일 ${list.length} · 완료 ${list.filter(x => x.it.done).length}` : ""));
  box.appendChild(h3);
  if (editing){
    list.forEach(x => {
      const row = el("div", "erow");
      const cb = el("input"); cb.type = "checkbox"; cb.checked = !!x.it.done; cb.setAttribute("aria-label", "완료");
      cb.onchange = () => { x.it.done = cb.checked; markDone(x.it, cb.checked); render(); };
      const tg = el("span", "tag", only ? KIND[x.kind] : `${x.n} · ${KIND[x.kind]}`);
      const tx = el("input"); tx.type = "text"; tx.value = x.it.t || ""; tx.setAttribute("aria-label", "할 일 내용"); tx.dataset.id = x.it.id || "";
      tx.oninput = () => { x.it.t = tx.value; };
      const dt = el("input"); dt.type = "date"; dt.value = x.d; dt.setAttribute("aria-label", "날짜");
      dt.onchange = () => { if (!dt.value) return; if (x.kind === "hw") x.it.due = dt.value; else x.it.date = dt.value; render(); };
      const del = el("button", "del", "✕"); del.type = "button"; del.setAttribute("aria-label", "삭제");
      del.onclick = () => { x.arr.splice(x.arr.indexOf(x.it), 1); render(); };
      row.append(cb, tg, tx, dt, del); box.appendChild(row);
    });
    const row = el("div", "erow");
    let sel = null;
    if (!only){
      sel = el("select", "sj"); sel.setAttribute("aria-label", "과목");
      TS(t).forEach(x => sel.add(new Option(x.n, x.k))); sel.add(new Option("공통", "_cal"));
      sel.value = nav.calAdd && [...sel.options].some(o => o.value === nav.calAdd) ? nav.calAdd : sel.options[0].value;
      sel.onchange = () => { nav.calAdd = sel.value; };
      row.appendChild(sel);
    }
    const add = el("button", "add", `+ ${md(cur)} 할 일 추가`); add.type = "button"; add.style.marginTop = "0"; add.style.flex = "1";
    add.onclick = () => {
      const it = { id: uid(), t: "", done: false, date: calSel };
      const k = only || sel.value; nav.calAdd = k;
      if (k === "_cal") draft.cal.push(it); else draft.terms[t].subjects[k][only ? ex : curExam()].todo.push(it);
      render();
      const inp = $("panel").querySelector(`.calsec .erow input[data-id="${it.id}"]`); if (inp) inp.focus();
    };
    row.appendChild(add); box.appendChild(row);
  } else if (!list.length) box.appendChild(el("p", "empty", "이날 할 일이 없습니다." + (editing ? "" : " '관리'에서 추가할 수 있습니다.")));
  else {
    const ul = el("ul", "list");
    list.forEach(x => {
      const li = el("li"); if (x.it.done) li.classList.add("done");

      ul.appendChild(li);
    });
    box.appendChild(ul);
  }
  sec.appendChild(box);
  return sec;
}

function planKeys(d){
  const t = d.curTerm, T = d.terms[t];
  const pick = (re, k, n) => {
    let x = T.subjList.find(s => re.test(s.n)) || T.subjList.find(s => s.k === k);
    if (!x){ x = { k: "s" + uid(), n, g: k }; T.subjList.push(x); T.subjects[x.k] = emptyPair(); T.grades[x.k] = {}; }
    return x.k;
  };
  return { T, ex: d.curExam || "fin", key: { soc: pick(/통합사회|통사/, "soc", "통합사회"), hist: pick(/한국사|역사/, "hist", "한국사") } };
}
function addPlan(d, plan){
  const { T, ex, key } = planKeys(d);
  const arrOf = k => k === "cal" ? d.cal : T.subjects[key[k]][ex].todo;
  const done = new Set();
  ["cal", "soc", "hist"].forEach(k => arrOf(k).forEach(it => { if (it.done) done.add(it.t); }));
  plan.forEach(([m, k, text]) => {
    const date = "2026-" + m, arr = arrOf(k);
    if (arr.some(it => it.date === date && it.t === text)) return;
    if (done.has(text) && !/^예비일/.test(text)) return;          // 이미 끝낸 건 다시 안 넣음
    arr.push({ id: uid(), t: text, done: false, date });
  });
  if (!T.examDates[ex]) T.examDates[ex] = "2026-12-09";
}
/* 처음 넣기: 바뀐 계획으로 */
function seedPlan(d){
  if ((d.seeds || {}).plan1) return;
  addPlan(d, PLAN2);
  d.seeds = Object.assign({}, d.seeds, { plan1: true, plan2: true });
}
/* 이미 넣은 예전 계획 → 바뀐 계획 (안 끝낸 예전 항목만 지우고 새로 넣음) */
function movePlan2(d){
  if (!(d.seeds || {}).plan1 || (d.seeds || {}).plan2) return;
  const { T, ex, key } = planKeys(d);
  const old = new Set(PLAN1.map(([m, k, text]) => k + "|2026-" + m + "|" + text));
  const keep = k => it => it.done || !old.has(k + "|" + it.date + "|" + it.t);
  d.cal = d.cal.filter(keep("cal"));
  ["soc", "hist"].forEach(k => { const o = T.subjects[key[k]][ex]; o.todo = o.todo.filter(keep(k)); });
  addPlan(d, PLAN2);
  d.seeds = Object.assign({}, d.seeds, { plan2: true });
}

/* ---------- 계산 ---------- */
function dday(dateStr){
  const d = parseD(dateStr); if (!d) return null;
  const diff = Math.round((d - parseD(today())) / 86400000);
  return { diff, d, label: diff === 0 ? "D-day" : diff > 0 ? `D-${diff}` : `D+${-diff}` };
}
function dueInfo(due){
  const x = dday(due); if (!x) return null;
  const label = `${md(x.d)} · ` + (x.diff === 0 ? "오늘" : x.diff > 0 ? `D-${x.diff}` : `${-x.diff}일 지남`);
  return { label, cls: x.diff < 0 ? "over" : x.diff <= 2 ? "soon" : "" };
}
function leftCount(t, k, ex){ const s = subjOf(t, k, ex); return s.hw.filter(i => !i.done).length + s.todo.filter(i => !i.done).length; }
const examDate = (t, ex) => (view().terms[t].examDates || {})[ex] || "";
function nextExam(t){
  const list = EXAMS.map(e => ({ ex: e.k, dd: dday(examDate(t, e.k)) })).filter(x => x.dd && x.dd.diff >= 0);
  list.sort((a, b) => a.dd.diff - b.dd.diff);
  return list[0] || null;
}
/* 평균 등급: 학점(단위)을 가중치로, 학점을 비우면 1로 계산 */
function avgGrade(terms){
  let s = 0, w = 0;
  terms.forEach(t => TS(t).forEach(x => {
    const g = view().terms[t].grades[x.k] || {}, gr = parseFloat(g.grade);
    if (!gr) return;
    const c = parseFloat(g.credit) > 0 ? parseFloat(g.credit) : 1;
    s += gr * c; w += c;
  }));
  return w ? s / w : null;
}

    EXAMS.forEach(e => {
    const s = subjOf(t, x.k, e.k), base = { k: x.k, n: x.n, g: x.g };
    s.prog.forEach(it => { if (it.s === 2 && it.doneAt === day) out.push({ ...base, sec: "prog", t: it.t }); });
    s.hw.forEach(it => { if (it.done && it.doneAt === day) out.push({ ...base, sec: "hw", t: it.t }); });
    s.todo.forEach(it => { if (it.done && it.doneAt === day) out.push({ ...base, sec: "todo", t: it.t }); });
    });
  });
  (view().cal || []).forEach(it => { if (it.done && it.doneAt === day) out.push({ k: "_cal", n: "공통", g: "etc", sec: "todo", t: it.t }); });

/* 시험별 평균 점수 (입력된 과목만) */
function examAvg(t, ex){
  let s = 0, n = 0;
  TS(t).forEach(x => { const v = num(gOf(t, x.k)[ex]); if (v != null){ s += v; n++; } });

}
/* 모의고사 평균 (입력된 과목 단순 평균) */
function mockAvg(e, f){

const fmt1 = v => v == null ? "—" : (Math.abs(v % 1) < 1e-9 ? String(v) : v.toFixed(1));
/* 눈금: g5/g9 = 등급(1이 위), pct = 0~100, free = 자료 범위 */
function makeScale(kind, vals){
  if (kind === "g5" || kind === "g9"){ const mx = kind === "g5" ? 5 : 9; return { inv: true, lo: 1, hi: mx, ticks: kind === "g5" ? [1,2,3,4,5] : [1,3,5,7,9] }; }
  let lo, hi;
  if (kind === "pct"){ hi = 100; lo = Math.max(0, Math.floor((Math.min(...vals) - 5) / 10) * 10); if (hi - lo < 20) lo = hi - 20; }
  else { hi = Math.ceil((Math.max(...vals) + 5) / 10) * 10; lo = Math.max(0, Math.floor((Math.min(...vals) - 5) / 10) * 10); if (hi - lo < 20) lo = Math.max(0, hi - 20); }
  const st = hi - lo > 50 ? 20 : 10, ticks = [];
  for (let v = lo; v <= hi; v += st) ticks.push(v);
  return { inv: false, lo, hi, ticks };
}
const SVGNS = "http://www.w3.org/2000/svg";
const sv = (tag, attrs, text) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; };
function lineChart(pts, kind, color, W, H, emptyMsg){
  const box = el("div", "chart"); box.style.setProperty("--c", color);
  const vals = pts.map(p => p.v).filter(v => v != null);
  if (!vals.length){ box.appendChild(el("div", "cempty", emptyMsg || "아직 입력된 성적이 없습니다. '관리'에서 입력하세요.")); return box; }
  const sc = makeScale(kind, vals);
  const pl = 30, pr = 16, ptop = 14, pb = pts.some(p => p.x2) ? 34 : 22;
  const iw = W - pl - pr, ih = H - ptop - pb;
  const X = i => pl + (pts.length === 1 ? iw / 2 : i * iw / (pts.length - 1));
  const Y = v => sc.inv ? ptop + (v - sc.lo) / (sc.hi - sc.lo) * ih : ptop + (sc.hi - v) / (sc.hi - sc.lo) * ih;
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img" });
  sc.ticks.forEach(v => { svg.appendChild(sv("line", { class: "grid", x1: pl, x2: W - pr, y1: Y(v), y2: Y(v) })); svg.appendChild(sv("text", { class: "axis", x: pl - 6, y: Y(v) + 4, "text-anchor": "end" }, v)); });
  const step = pts.length > 1 ? iw / (pts.length - 1) : 0;
  pts.forEach((p, i) => {
    if (p.x) svg.appendChild(sv("text", { class: "axis", x: X(i) + (p.span ? step * (p.span - 1) / 2 : 0), y: H - (p.x2 ? 16 : 4), "text-anchor": "middle" }, p.x));
    if (p.x2) svg.appendChild(sv("text", { class: "axis", x: X(i), y: H - 3, "text-anchor": "middle" }, p.x2));
  });
  let d = "", run = [];
  const flush = () => { if (run.length > 1) d += run.map((q, j) => (j ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" ") + " "; run = []; };
  pts.forEach((p, i) => { if (p.v == null) flush(); else run.push([X(i), Y(p.v)]); }); flush();
  if (d) svg.appendChild(sv("path", { class: "line", d }));
  const tip = el("div", "tip"); tip.hidden = true;
  const show = (p, i) => { tip.textContent = p.tip; tip.style.left = (X(i) / W * 100) + "%"; tip.style.top = (Y(p.v) / H * 100) + "%"; tip.hidden = false; };
  let lastI = -1; pts.forEach((p, i) => { if (p.v != null) lastI = i; });
  pts.forEach((p, i) => {
    if (p.v == null) return;
    const dot = sv("circle", { class: "pt", cx: X(i), cy: Y(p.v), r: 4.5 });
    const hit = sv("circle", { class: "hit", cx: X(i), cy: Y(p.v), r: 16, tabindex: 0, "aria-label": p.tip });
    hit.addEventListener("pointerenter", () => { dot.classList.add("on"); show(p, i); });
    hit.addEventListener("pointerleave", () => { dot.classList.remove("on"); tip.hidden = true; });
    hit.addEventListener("click", () => show(p, i));
    hit.addEventListener("focus", () => show(p, i));
    hit.addEventListener("blur", () => { tip.hidden = true; });
    svg.append(hit, dot);
  });
  const lp = pts[lastI], lx = X(lastI), anchor = lx > W - 40 ? "end" : "middle";
  const lv = sc.inv ? (lp.v % 1 ? lp.v.toFixed(2) : String(lp.v)) : fmt1(lp.v);
  svg.appendChild(sv("text", { class: "vlabel", x: anchor === "end" ? lx - 6 : lx, y: Y(lp.v) - 10, "text-anchor": anchor }, lv));
  box.append(svg, tip);
  return box;
}
function segCtl(opts, val, on){

            : "평균 등급은 학점(단위)을 가중치로 계산합니다. 학점이 비어 있으면 1로 계산합니다.", ["grade", "credit"]));
  renderCompare(p, SRC.school, "c");
  renderOverall(p, SRC.school, TERMS, "전체 추이", "allM", false);
  renderPeriod(p, SRC.school, "per");
}
/* 성적표 (내신·모의 공용) */
function gradeTable(title, list, fields, getRow, avgFn, avgLabel, note, liveKeys){
  const s2 = el("section", "sec");
  const h = el("h2", null, title);
  const hm = el("span", "meta", avgLabel(avgFn())); h.appendChild(hm);
  s2.appendChild(h);
  const wrap = el("div", "gtwrap"), tb = el("table", "gt");
  const thead = el("thead"), hr = el("tr");
  hr.appendChild(el("th", null, "과목")); fields.forEach(f => hr.appendChild(el("th", null, f.n)));
  thead.appendChild(hr); tb.appendChild(thead);
  const tbody = el("tbody");
  const fv = el("td", null, fmtG(avgFn()));
  if (!list.length){ const tr = el("tr"), td = el("td", "na", editing ? "학년 탭 → 학기 → '+ 과목 추가'로 과목을 먼저 넣으세요." : "이 학기에 등록된 과목이 없습니다."); td.colSpan = fields.length + 1; tr.appendChild(td); tbody.appendChild(tr); }
  list.forEach(x => {
    const tr = el("tr"); tr.style.setProperty("--c", `var(--${x.g})`);
    tr.appendChild(el("td", "sn", x.n));
    const g = getRow(x.k);
    fields.forEach(f => {
      const td = el("td");
      if (editing){
        let inp;
        if (f.type === "sel"){ inp = el("select"); f.opts.forEach(o => inp.add(new Option(o || "—", o))); inp.value = g[f.k] || ""; }
        else { inp = el("input"); inp.type = "number"; inp.inputMode = "decimal"; inp.min = 0; inp.step = "any"; inp.value = g[f.k] != null ? g[f.k] : ""; }
        inp.setAttribute("aria-label", `${x.n} ${f.n}`);
        inp.onchange = () => {
          g[f.k] = inp.value;
          if (liveKeys.includes(f.k)){ const v = avgFn(); renderTabs(); hm.textContent = avgLabel(v); fv.textContent = fmtG(v); }
        };
        td.appendChild(inp);
      } else {
        const v = g[f.k];
        if (v == null || v === ""){ td.className = "na"; td.textContent = "—"; }
        else if (f.k === "grade"){ td.appendChild(el("span", "gr", `${v}`)); }
        else td.textContent = v;
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  tb.appendChild(tbody);
  const tf = el("tfoot"), fr = el("tr");
  fr.appendChild(el("td", null, "평균 등급"));
  fv.colSpan = fields.length; fv.style.textAlign = "right";
  fr.appendChild(fv); tf.appendChild(fr); tb.appendChild(tf);
  wrap.appendChild(tb); s2.appendChild(wrap);
  s2.appendChild(el("p", "gnote", note));
  return s2;
}
/* ---------- 모의고사 ---------- */
function renderMock(p){

  const sec = el("section", "sec");

    });

  p.appendChild(gradeTable(`${mockName(e)} 모의고사`, SUBJECTS, MFIELDS, k => { const m = view().mock[e]; if (!m[k]) m[k] = {}; return m[k]; },
    () => mockGradeAvg([e]), v => `평균 ${fmtG(v)}등급`,
    "평균 등급은 입력한 과목 등급의 단순 평균입니다. 영어·한국사처럼 절대평가 과목은 표준점수·백분위를 비워 두면 됩니다.", ["grade"]));
  renderCompare(p, SRC.mock, "mc");

function mockGradeAvg(keys){
  let s = 0, n = 0;
  keys.forEach(e => SUBJECTS.forEach(x => { const v = num(mOf(e, x.k).grade); if (v != null){ s += v; n++; } }));
  return n ? s / n : null;
}

/* ---------- 과목 ---------- */
function renderSection(t, k, ex, s, items){
  const sec = el("section", "sec");
  const h = el("h2", null, s.n);
  let meta = "";
  if (s.k === "prog" && items.length) meta = `완료 ${items.filter(i => i.s === 2).length} / ${items.length}`;
  if ((s.k === "hw" || s.k === "todo") && items.length) meta = `남음 ${items.filter(i => !i.done).length} / ${items.length}`;
  h.appendChild(el("span", "meta", meta)); sec.appendChild(h);

  if (editing){ sec.appendChild(editList(t, k, ex, s, items)); return sec; }
  const quick = !VIEW_ONLY && s.k !== "range";        // 온유: 관리 안 눌러도 바로 고치기
  if (quick) sec.classList.add("qe");
  if (!items.length){ sec.appendChild(el("p", "empty", quick ? `아직 ${s.n} 내용이 없습니다. 아래에서 바로 추가하세요.` : `아직 ${s.n} 내용이 없습니다. '관리'를 눌러 추가하세요.`)); if (quick) sec.appendChild(quickAdd(t, k, ex, s)); return sec; }
  if (s.k === "prog"){
    const n = items.length, d = items.filter(i => i.s === 2).length, p = items.filter(i => i.s === 1).length;
    const bar = el("div", "bar"); const i1 = el("i"); i1.style.width = d / n * 100 + "%"; const b1 = el("b"); b1.style.width = p / n * 100 + "%";
    bar.append(i1, b1); sec.appendChild(bar);
  }
  const ul = el("ul", "list");
  let list = items.slice();
  if (s.k === "todo") list.sort((a, b) => (a.done - b.done) || ((a.date || "9999") < (b.date || "9999") ? -1 : (a.date || "9999") > (b.date || "9999") ? 1 : 0));
  if (s.k === "hw") list.sort((a, b) => (a.done - b.done) || ((a.due || "9999") < (b.due || "9999") ? -1 : (a.due || "9999") > (b.due || "9999") ? 1 : 0));
  list.forEach(it => {
    const li = el("li");
    if (quick){ quickRow(li, t, k, ex, s, it, items); ul.appendChild(li); return; }
    if (s.k === "range") li.append(el("span", "bullet"), el("span", "txt", it.t));
    if (s.k === "prog") li.append(el("span", "txt", it.t), el("span", "pill s" + (it.s || 0), PROG[it.s || 0]));
    if (s.k === "hw" || s.k === "todo"){
      if (it.done) li.classList.add("done");
      const mk = el("button", "mark", it.done ? "✓" : ""); mk.type = "button"; mk.setAttribute("aria-label", it.done ? "완료 취소" : "완료로 표시");
      mk.onclick = () => toggleItem({ it });
      li.append(mk, el("span", "txt", it.t));
      if (s.k === "hw"){ const di = dueInfo(it.due); if (di) li.appendChild(el("span", "due " + (it.done ? "" : di.cls), di.label)); }
      if (s.k === "todo" && it.date){ const dd = parseD(it.date); if (dd) li.appendChild(el("span", "due" + (!it.done && it.date < today() ? " over" : it.date === today() ? " soon" : ""), md(dd))); }
    }
    ul.appendChild(li);
  });
  sec.appendChild(ul);
  if (quick) sec.appendChild(quickAdd(t, k, ex, s));
  return sec;
}
/* ----- 바로 고치기: 저장된 데이터에서 같은 항목 찾기 (id, 없으면 순서+내용) ----- */
function qFind(d, t, k, ex, sk, it, idx){
  const arr = (((d.terms[t] || {}).subjects || {})[k] || {})[ex]; const a = arr && arr[sk]; if (!a) return null;
  if (it.id) return a.find(x => x.id === it.id) || null;
  return a[idx] && a[idx].t === it.t ? a[idx] : null;
}
function qSave(t, k, ex, sk, it, items, fn){
  const idx = items.indexOf(it), copy = { id: it.id, t: it.t };
  commit(d => { const x = qFind(d, t, k, ex, sk, copy, idx); if (x){ if (!x.id) x.id = uid(); fn(x); } });
}
function quickRow(li, t, k, ex, s, it, items){
  const sk = s.k;
  if (sk !== "prog"){
    if (it.done) li.classList.add("done");
    const mk = el("button", "mark", it.done ? "✓" : ""); mk.type = "button"; mk.setAttribute("aria-label", it.done ? "완료 취소" : "완료로 표시");
    mk.onclick = () => { const want = !it.done; qSave(t, k, ex, sk, it, items, x => { x.done = want; markDone(x, want); }); };
    li.appendChild(mk);
  }
  /* 글: 누르면 고치기 */
  const tx = el("span", "txt", it.t); tx.tabIndex = 0; tx.setAttribute("role", "button"); tx.setAttribute("aria-label", `${it.t} 고치기`);
  const editText = () => {
    if (tx.querySelector("input")) return;
    const inp = el("input"); inp.type = "text"; inp.value = it.t || ""; inp.setAttribute("aria-label", s.n + " 내용 고치기");
    tx.textContent = ""; tx.appendChild(inp); inp.focus(); inp.select();
    let done = false;
    const finish = save => { if (done) return; done = true; const v = inp.value.trim(); if (save && v && v !== it.t) qSave(t, k, ex, sk, it, items, x => { x.t = v; }); else render(); };
    inp.onkeydown = e => { if (e.key === "Enter" && !e.isComposing){ e.preventDefault(); finish(true); } if (e.key === "Escape") finish(false); };
    inp.onblur = () => finish(true);
  };
  tx.onclick = editText; tx.onkeydown = e => { if (e.key === "Enter") editText(); };
  li.appendChild(tx);
  /* 진도: 누를 때마다 안 함 → 진행 중 → 완료 */
  if (sk === "prog"){
    const st = it.s || 0, pb = el("button", "pill s" + st, PROG[st]); pb.type = "button"; pb.setAttribute("aria-label", `진도 상태 ${PROG[st]}, 누르면 바꾸기`);
    pb.onclick = () => { const n = ((it.s || 0) + 1) % 3; qSave(t, k, ex, sk, it, items, x => { x.s = n; markDone(x, n === 2); }); };
    li.appendChild(pb);
  }
  /* 날짜: 누르면 바꾸기 */
  if (sk === "hw" || sk === "todo"){
    const key = sk === "hw" ? "due" : "date", v = it[key] || "";
    let label = "날짜", cls = "due qd";
    if (sk === "hw"){ const di = dueInfo(v); if (di){ label = di.label; if (!it.done) cls += " " + di.cls; } else { label = "마감일"; cls += " none"; } }
    else if (v){ const dd = parseD(v); label = md(dd); if (!it.done && v < today()) cls += " over"; else if (v === today()) cls += " soon"; }
    else cls += " none";
    const dl = el("span", cls, label); dl.tabIndex = 0; dl.setAttribute("role", "button"); dl.setAttribute("aria-label", (sk === "hw" ? "마감일" : "할 날짜") + " 바꾸기");
    const editDate = () => {
      const di = el("input", "qdate"); di.type = "date"; di.value = v; di.setAttribute("aria-label", sk === "hw" ? "마감일" : "할 날짜");
      dl.replaceWith(di); di.focus(); try { di.showPicker && di.showPicker(); } catch(e){}
      di.onchange = () => qSave(t, k, ex, sk, it, items, x => { x[key] = di.value; });
      di.onblur = () => setTimeout(() => { if (document.body.contains(di)) render(); }, 200);
    };
    dl.onclick = editDate; dl.onkeydown = e => { if (e.key === "Enter") editDate(); };
    li.appendChild(dl);
  }
  /* 지우기: 두 번 누르기 */
  const del = el("button", "qx", "✕"); del.type = "button"; del.setAttribute("aria-label", "삭제");
  del.onclick = () => {
    if (!del.classList.contains("arm")){ del.classList.add("arm"); del.textContent = "삭제?"; setTimeout(() => { del.classList.remove("arm"); del.textContent = "✕"; }, 3000); return; }
    const idx = items.indexOf(it), copy = { id: it.id, t: it.t };
    commit(d => { const x = qFind(d, t, k, ex, sk, copy, idx); if (x){ const a = d.terms[t].subjects[k][ex][sk]; a.splice(a.indexOf(x), 1); } });
  };
  li.appendChild(del);
}
function quickAdd(t, k, ex, s){
  const sk = s.k, row = el("div", "erow");
  const tx = el("input"); tx.type = "text"; tx.placeholder = s.ph; tx.setAttribute("aria-label", s.add);
  row.appendChild(tx);
  let dt = null;
  if (sk === "hw" || sk === "todo"){ dt = el("input"); dt.type = "date"; dt.setAttribute("aria-label", sk === "hw" ? "마감일" : "할 날짜 (캘린더에 표시)"); if (sk === "todo") dt.value = today(); row.appendChild(dt); }
  const b = el("button", "btn primary", "추가"); b.type = "button";
  const go = () => {
    const v = tx.value.trim(); if (!v){ tx.focus(); return; }
    const it = { id: uid(), t: v };
    if (sk === "prog") it.s = 0;
    if (sk === "hw"){ it.done = false; it.due = dt.value; }
    if (sk === "todo"){ it.done = false; it.date = dt.value; }
    tx.value = "";
    commit(d => { const a = d.terms[t].subjects[k][ex][sk]; if (!a.some(x => x.id === it.id)) a.push(Object.assign({}, it)); });
  };
  b.onclick = go;
  tx.onkeydown = e => { if (e.key === "Enter" && !e.isComposing){ e.preventDefault(); go(); } };
  row.appendChild(b);
  return row;
}
function markDone(it, on){ if (on) it.doneAt = today(); else delete it.doneAt; }
function editList(t, k, ex, s, items){
  const wrap = el("div");
  items.forEach((it, idx) => {
    const row = el("div", "erow");
    if (s.k === "todo" || s.k === "hw"){
      const cb = el("input"); cb.type = "checkbox"; cb.checked = !!it.done; cb.setAttribute("aria-label", "완료");
      cb.onchange = () => { it.done = cb.checked; markDone(it, cb.checked); renderTabs(); };
      row.appendChild(cb);
    }
    const tx = el("input"); tx.type = "text"; tx.value = it.t || ""; tx.placeholder = s.ph; tx.setAttribute("aria-label", s.n + " 내용");
    tx.oninput = () => { it.t = tx.value; };
    tx.onkeydown = e => { if (e.key === "Enter" && !e.isComposing){ e.preventDefault(); addItem(t, k, ex, s.k); } };
    row.appendChild(tx);
    if (s.k === "prog"){
      const sel = el("select"); sel.setAttribute("aria-label", "진도 상태");
      PROG.forEach((p, i) => sel.add(new Option(p, i))); sel.value = it.s || 0;
      sel.onchange = () => { it.s = +sel.value; markDone(it, it.s === 2); };
      row.appendChild(sel);
    }
    if (s.k === "hw"){
      const dt = el("input"); dt.type = "date"; dt.value = it.due || ""; dt.setAttribute("aria-label", "마감일");
      dt.onchange = () => { it.due = dt.value; };
      row.appendChild(dt);
    }
    if (s.k === "todo"){
      const dt = el("input"); dt.type = "date"; dt.value = it.date || ""; dt.setAttribute("aria-label", "할 날짜 (캘린더에 표시)");
      dt.onchange = () => { it.date = dt.value; };
      row.appendChild(dt);
    }
    const del = el("button", "del", "✕"); del.type = "button"; del.setAttribute("aria-label", "삭제");
    del.onclick = () => { items.splice(idx, 1); render(); };
    row.appendChild(del);
    wrap.appendChild(row);
  });
  const add = el("button", "add", "+ " + s.add); add.type = "button";
  add.onclick = () => addItem(t, k, ex, s.k);
  wrap.appendChild(add);
  return wrap;
}
function addItem(t, k, ex, sk){
  const items = draft.terms[t].subjects[k][ex][sk];
  const it = { id: uid(), t: "" };
  if (sk === "prog") it.s = 0;
  if (sk === "hw" || sk === "todo") it.done = false;
  if (sk === "hw") it.due = "";
  items.push(it); render();
  const secs = $("panel").querySelectorAll(".sec");
  const inputs = secs[SECTIONS.findIndex(x => x.k === sk)].querySelectorAll('input[type="text"]');
  if (inputs.length) inputs[inputs.length - 1].focus();
}

/* ---------- 그리기 ---------- */
function render(){
  renderTabs();
  const p = $("panel"); p.innerHTML = "";
  if (nav.main === "home"){ p.style.setProperty("--c", "var(--home)"); return renderHome(p); }
  if (nav.main === "grade"){ p.style.setProperty("--c", "var(--grade)"); return renderGrade(p); }
  const t = navTerm();
  const cs = TS(t).find(x => x.k === nav.subj);
  if (!cs){ p.style.setProperty("--c", "var(--rule)"); const s = el("section", "sec"); s.appendChild(el("p", "empty", editing ? "위의 '과목 관리'에서 과목을 추가하면 여기에 시험범위·진도·숙제·할 것을 적을 수 있습니다." : "이 학기에 등록된 과목이 없습니다. '관리' → '+ 과목 추가'로 과목을 넣으세요.")); p.appendChild(s); return; }
  p.style.setProperty("--c", `var(--${cs.g})`);
  const ex = navEx(), s = subjOf(t, nav.subj, ex);
  p.appendChild(renderCal(t, nav.subj, ex));
  SECTIONS.forEach(sec => p.appendChild(renderSection(t, nav.subj, ex, sec, s[sec.k])));
}

render();
let lastW = window.innerWidth;
window.addEventListener("resize", () => { if (window.innerWidth !== lastW){ lastW = window.innerWidth; clearTimeout(window._rz); window._rz = setTimeout(render, 150); } });
setSync(rev ? "busy" : "load", rev ? "최신 내용 확인 중…" : "불러오는 중…");
pull();
setInterval(() => { if (document.visibilityState === "visible") pull(); }, 30000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pull(); });
</script>
